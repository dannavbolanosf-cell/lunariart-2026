    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-4" style="width: 100%; max-width: 450px;">
            <h3 class="text-center mb-4">Crear Cuenta</h3>
            <form action="#" method="POST">
                <div class="mb-3">
                    <label for="regName" class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" id="regName" required>
                </div>
                <div class="mb-3">
                    <label for="regEmail" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="regEmail" required>
                </div>
                <div class="mb-3">
                    <label for="regPass" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="regPass" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Registrarse</button>
                <div class="text-center">
                    <a href="login.html" class="text-decoration-none">¿Ya tienes cuenta? Inicia Sesión</a>
                </div>
            </form>
        </div>
    </div>
